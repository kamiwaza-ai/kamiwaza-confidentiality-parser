name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]' 'build>=1,<2'
      - run: python -m pytest
      - run: python -m build --sdist --outdir dist
      - run: python -m pip wheel --wheel-dir wheelhouse dist/*.tar.gz
      - run: python scripts/check_distribution.py dist/*.tar.gz wheelhouse/kamiwaza_confidentiality_parser-*.whl
      - run: python scripts/offline_smoke.py wheelhouse
